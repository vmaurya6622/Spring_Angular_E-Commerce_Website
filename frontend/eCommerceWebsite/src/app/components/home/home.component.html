<div [class.dark]="darkMode" class="page">
  <div style="display:none" [attr.data-load-products]="(loadProductsEffect$ | async) ? '' : ''"></div>
  <div style="display:none" [attr.data-load-cart]="(loadCartItemsEffect$ | async) ? '' : ''"></div>
  <div style="display:none" [attr.data-add-cart]="(addToCartEffect$ | async) ? '' : ''"></div>
  <app-navbar
    [darkMode]="darkMode"
    [searchText]="searchText"
    [isLoggedIn]="isLoggedIn"
    [customerName]="customerName"
    (searchChange)="onSearch($event)"
    (themeToggle)="toggleTheme()"
    (logoutEvent)="logout()"
  >
  </app-navbar>

  <section class="hero">
    <div class="hero-content">
      <h1>Shop the Latest Arrivals</h1>
      <p class="yoyo">Browse handpicked products and add them to your cart in one click.</p>
    </div>
  </section>

  <div class="grid">
    <div class="book-card" *ngFor="let book of paginatedBooks$ | async">
      <!-- Image -->
      <div class="image-wrapper">
        <img [src]="book.image" alt="" />
      </div>

      <!-- Title -->
      <h3 class="book-title">{{ book.title }}</h3>

      <!-- Price -->
      <div class="price">₹{{ book.price }}</div>

      <!-- Rating -->
      <div class="rating">
        ⭐⭐⭐⭐½
        <span class="rating-value">4.5</span>
      </div>

      <!-- Bottom Section -->
      <div class="card-bottom">
        <button *ngIf="book.stock > 0" (click)="addToCart(book)" class="add-btn">
          Add to Cart
        </button>

        <div *ngIf="book.stock > 0" class="stock-box">
          Stock: <span>{{ book.stock }}</span>
        </div>

        <div *ngIf="book.stock === 0" class="out-stock">Out of Stock</div>
      </div>

      <button class="details-btn" (click)="viewDetails(book.id)">View Details</button>
    </div>
  </div>

  <!-- PAGINATION -->

  <app-pagination
    [currentPage]="currentPage"
    [totalPages]="(totalPages$ | async) ?? 1"
    (pageChange)="changePage($event)"
  >
  </app-pagination>

  <app-common-footer></app-common-footer>
</div>
